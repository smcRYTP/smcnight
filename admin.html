<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>smcNight — Панель управления</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f8fc;
            color: #1a2a3e;
            padding: 20px;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: #0d1a2b;
            color: #e8f0f8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: #fff;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #d0ddee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        body.dark .header {
            background: #0f1f32;
            border-color: #2a4a6a;
        }

        .header__logo {
            font-size: 22px;
            font-weight: 700;
        }

        .header__logo span {
            color: #2b7be4;
        }

        body.dark .header__logo span {
            color: #4a9eff;
        }

        .header__actions {
            display: flex;
            gap: 10px;
        }

        .btn-back, .btn-theme {
            background: #e9eff6;
            border: 1px solid #d0ddee;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            font-family: inherit;
            text-decoration: none;
            color: inherit;
        }

        body.dark .btn-back,
        body.dark .btn-theme {
            background: #1a2f45;
            border-color: #2a4a6a;
            color: #e8f0f8;
        }

        .btn-back:hover, .btn-theme:hover {
            background: #dce8f8;
            border-color: #2b7be4;
        }

        /* Авторизация */
        .auth {
            max-width: 400px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #2b7be4;
            text-align: center;
        }

        body.dark .auth {
            background: #152a40;
        }

        .auth__title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .auth__input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d0ddee;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            margin-bottom: 12px;
            background: #f5f8fc;
            transition: border-color 0.2s;
        }

        body.dark .auth__input {
            background: #0d1a2b;
            border-color: #2a4a6a;
            color: #e8f0f8;
        }

        .auth__input:focus {
            outline: none;
            border-color: #2b7be4;
        }

        .auth__btn {
            width: 100%;
            padding: 12px;
            background: #2b7be4;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .auth__btn:hover {
            background: #1a5fb0;
        }

        .auth__error {
            color: #d45a5a;
            margin-top: 8px;
            display: none;
        }

        .auth__error.show {
            display: block;
        }

        .auth.hidden {
            display: none;
        }

        /* Панель */
        .panel {
            display: none;
        }

        .panel.show {
            display: block;
        }

        .panel__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #d0ddee;
        }

        body.dark .panel__header {
            border-color: #2a4a6a;
        }

        .panel__title {
            font-size: 20px;
            font-weight: 600;
            color: #2b7be4;
        }

        body.dark .panel__title {
            color: #4a9eff;
        }

        .panel__btn {
            padding: 8px 18px;
            background: #2b7be4;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            font-family: inherit;
        }

        .panel__btn:hover {
            background: #1a5fb0;
        }

        .panel__btn.danger {
            background: #d45a5a;
        }

        .panel__btn.danger:hover {
            background: #b33a3a;
        }

        .panel__section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #d0ddee;
        }

        body.dark .panel__section {
            border-color: #2a4a6a;
        }

        .panel__section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .panel__section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .panel__form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .panel__form input {
            padding: 10px 14px;
            border: 1px solid #d0ddee;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #f5f8fc;
            flex: 1 1 180px;
            transition: border-color 0.2s;
        }

        body.dark .panel__form input {
            background: #0d1a2b;
            border-color: #2a4a6a;
            color: #e8f0f8;
        }

        .panel__form input:focus {
            outline: none;
            border-color: #2b7be4;
        }

        .panel__form button {
            padding: 10px 20px;
            background: #2b7be4;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .panel__form button:hover {
            background: #1a5fb0;
        }

        .panel__list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .panel__list::-webkit-scrollbar {
            width: 4px;
        }

        .panel__list::-webkit-scrollbar-thumb {
            background: #2b7be4;
            border-radius: 10px;
        }

        .panel__item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #e9eff6;
            border-radius: 8px;
            border: 1px solid #d0ddee;
            gap: 10px;
            flex-wrap: wrap;
        }

        body.dark .panel__item {
            background: #1a2f45;
            border-color: #2a4a6a;
        }

        .panel__item-text {
            flex: 1;
            min-width: 100px;
            font-size: 14px;
        }

        .panel__item-actions {
            display: flex;
            gap: 6px;
        }

        .panel__item-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }

        .panel__item-actions .edit {
            background: #e8a838;
            color: #fff;
        }

        .panel__item-actions .delete {
            background: #d45a5a;
            color: #fff;
        }

        .panel__item-actions .edit:hover,
        .panel__item-actions .delete:hover {
            opacity: 0.8;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #8aaac0;
            font-size: 14px;
            border-top: 1px solid #d0ddee;
            margin-top: 30px;
        }

        body.dark .footer {
            border-color: #2a4a6a;
            color: #6080a0;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .panel__form {
                flex-direction: column;
            }
            .panel__form input {
                flex: 1;
                width: 100%;
            }
            .panel__form button {
                width: 100%;
            }
            .panel__item {
                flex-direction: column;
                align-items: stretch;
            }
            .panel__item-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Шапка -->
    <header class="header">
        <div class="header__logo">smc<span>Night</span> <span style="font-size:14px; font-weight:400; color:#5a7a9a;">— админ-панель</span></div>
        <div class="header__actions">
            <a href="index.html" class="btn-back">← На сайт</a>
            <button class="btn-theme" id="themeToggle">☀️ Светлая</button>
        </div>
    </header>

    <!-- Авторизация -->
    <div class="auth" id="auth">
        <div class="auth__title">🔐 Доступ к панели управления</div>
        <input type="password" class="auth__input" id="passwordInput" placeholder="Введите пароль" />
        <button class="auth__btn" id="authBtn">Войти</button>
        <div class="auth__error" id="authError">❌ Неверный пароль</div>
    </div>

    <!-- Панель -->
    <div class="panel" id="panel">
        <div class="panel__header">
            <span class="panel__title">🔧 Панель управления</span>
            <div>
                <button class="panel__btn danger" id="resetBtn">Сбросить всё</button>
                <button class="panel__btn" id="logoutBtn" style="background:#8aaac0;">🚪 Выйти</button>
            </div>
        </div>

        <!-- Новости -->
        <div class="panel__section">
            <div class="panel__section-title">📰 Управление новостями</div>
            <form class="panel__form" id="newsForm">
                <input type="hidden" id="newsEditId" />
                <input type="text" id="newsDate" placeholder="Дата (24.08.2026)" required />
                <input type="text" id="newsText" placeholder="Текст новости" required />
                <input type="text" id="newsBadge" placeholder="Бейдж (необязательно)" />
                <button type="submit" id="newsSubmitBtn">➕ Добавить</button>
            </form>
            <div class="panel__list" id="newsList"></div>
        </div>

        <!-- Программа передач -->
        <div class="panel__section">
            <div class="panel__section-title">📅 Управление программой передач</div>
            <form class="panel__form" id="scheduleForm">
                <input type="hidden" id="scheduleEditId" />
                <input type="text" id="scheduleTime" placeholder="Время (00:00)" required />
                <input type="text" id="scheduleProgram" placeholder="Название программы" required />
                <button type="submit" id="scheduleSubmitBtn">➕ Добавить</button>
            </form>
            <div class="panel__list" id="scheduleList"></div>
        </div>

        <!-- Видео -->
        <div class="panel__section">
            <div class="panel__section-title">🎬 Управление видео</div>
            <form class="panel__form" id="videoForm">
                <input type="hidden" id="videoEditId" />
                <input type="text" id="videoTitle" placeholder="Название программы" required />
                <input type="text" id="videoDate" placeholder="Дата (24.08.2026)" required />
                <input type="text" id="videoUrl" placeholder="Ссылка на видео" required />
                <button type="submit" id="videoSubmitBtn">➕ Добавить</button>
            </form>
            <div class="panel__list" id="videoList"></div>
        </div>

        <!-- Эфир -->
        <div class="panel__section">
            <div class="panel__section-title">📡 Управление эфиром</div>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button class="panel__btn" id="toggleOffline" style="background:#e8a838; color:#fff;">🔴 Выключить эфир</button>
                <span style="color:#5a7a9a; align-self:center;">Статус: <span id="streamStatus">🟢 В эфире</span></span>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2025–2026 <strong>smcNight</strong> — интернет-канал.</p>
    </footer>

</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // ПАРОЛЬ
        // ============================================================
        const ADMIN_PASSWORD = '0607202416042025'; // ← МЕНЯЙТЕ ЗДЕСЬ

        // ============================================================
        // ДАННЫЕ ПО УМОЛЧАНИЮ
        // ============================================================
        const DEFAULT_NEWS = [
            { id: 1, date: '24.08.2026', text: 'Запускаем новый формат — «Ночной джаз» по пятницам!', badge: 'новое' },
            { id: 2, date: '23.08.2026', text: 'Техническое обновление: улучшено качество трансляции.', badge: '' },
            { id: 3, date: '22.08.2026', text: 'smcNight теперь в Telegram-канале.', badge: 'важно' },
            { id: 4, date: '20.08.2026', text: 'Конкурс: присылайте свои клипы для эфира.', badge: '' },
            { id: 5, date: '18.08.2026', text: 'Новый ведущий в вечернем стриме — Андрей Н.', badge: '' },
        ];

        const DEFAULT_SCHEDULE = [
            { id: 1, time: '00:00', program: 'Ночной джаз' },
            { id: 2, time: '02:00', program: 'Киноклуб: триллер' },
            { id: 3, time: '04:30', program: 'Акустика' },
            { id: 4, time: '07:00', program: 'Утреннее шоу' },
            { id: 5, time: '10:00', program: 'Новости smc' },
            { id: 6, time: '12:00', program: 'Обеденный перерыв' },
            { id: 7, time: '14:00', program: 'Техно-микс' },
            { id: 8, time: '17:00', program: 'Вечерний стрим' },
            { id: 9, time: '20:00', program: 'Премьера' },
            { id: 10, time: '22:00', program: 'Ночной эфир' },
        ];

        const DEFAULT_VIDEOS = [
            { id: 1, title: 'Ночной джаз', date: '24.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 2, title: 'Киноклуб: триллер', date: '23.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 3, title: 'Акустика', date: '22.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 4, title: 'Утреннее шоу', date: '21.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 5, title: 'Техно-микс', date: '20.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 6, title: 'Вечерний стрим', date: '19.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 7, title: 'Премьера', date: '18.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            { id: 8, title: 'Ночной эфир', date: '17.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
        ];

        // ============================================================
        // LOCALSTORAGE
        // ============================================================
        function getData(key, defaultData) {
            try {
                const stored = localStorage.getItem('smcNight_' + key);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            saveData(key, defaultData);
            return defaultData;
        }

        function saveData(key, data) {
            try {
                localStorage.setItem('smcNight_' + key, JSON.stringify(data));
            } catch (e) {}
        }

        let newsData = getData('news', DEFAULT_NEWS);
        let scheduleData = getData('schedule', DEFAULT_SCHEDULE);
        let videoData = getData('videos', DEFAULT_VIDEOS);

        let nextNewsId = newsData.length ? Math.max(...newsData.map(n => n.id)) + 1 : 1;
        let nextScheduleId = scheduleData.length ? Math.max(...scheduleData.map(s => s.id)) + 1 : 1;
        let nextVideoId = videoData.length ? Math.max(...videoData.map(v => v.id)) + 1 : 1;

        // ============================================================
        // DOM
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const dom = {
            auth: $('#auth'),
            authError: $('#authError'),
            passwordInput: $('#passwordInput'),
            authBtn: $('#authBtn'),
            panel: $('#panel'),
            logoutBtn: $('#logoutBtn'),
            resetBtn: $('#resetBtn'),
            // News
            newsForm: $('#newsForm'),
            newsList: $('#newsList'),
            newsEditId: $('#newsEditId'),
            newsDate: $('#newsDate'),
            newsText: $('#newsText'),
            newsBadge: $('#newsBadge'),
            newsSubmitBtn: $('#newsSubmitBtn'),
            // Schedule
            scheduleForm: $('#scheduleForm'),
            scheduleList: $('#scheduleList'),
            scheduleEditId: $('#scheduleEditId'),
            scheduleTime: $('#scheduleTime'),
            scheduleProgram: $('#scheduleProgram'),
            scheduleSubmitBtn: $('#scheduleSubmitBtn'),
            // Videos
            videoForm: $('#videoForm'),
            videoList: $('#videoList'),
            videoEditId: $('#videoEditId'),
            videoTitle: $('#videoTitle'),
            videoDate: $('#videoDate'),
            videoUrl: $('#videoUrl'),
            videoSubmitBtn: $('#videoSubmitBtn'),
            // Stream
            toggleOffline: $('#toggleOffline'),
            streamStatus: $('#streamStatus'),
            // Theme
            themeToggle: $('#themeToggle'),
        };

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        let isAdmin = false;

        function checkAuth() {
            try {
                if (localStorage.getItem('smcNight_admin_auth') === 'true') {
                    isAdmin = true;
                    dom.auth.classList.add('hidden');
                    dom.panel.classList.add('show');
                    renderAll();
                    loadStreamState();
                    return;
                }
            } catch (e) {}
            dom.auth.classList.remove('hidden');
            dom.panel.classList.remove('show');
        }

        function login() {
            const pwd = dom.passwordInput.value.trim();
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('smcNight_admin_auth', 'true');
                dom.auth.classList.add('hidden');
                dom.authError.classList.remove('show');
                dom.panel.classList.add('show');
                dom.passwordInput.value = '';
                renderAll();
                loadStreamState();
            } else {
                dom.authError.classList.add('show');
                dom.passwordInput.value = '';
                dom.passwordInput.focus();
            }
        }

        function logout() {
            isAdmin = false;
            localStorage.removeItem('smcNight_admin_auth');
            dom.panel.classList.remove('show');
            dom.auth.classList.remove('hidden');
            dom.authError.classList.remove('show');
            dom.passwordInput.value = '';
        }

        dom.authBtn.addEventListener('click', login);
        dom.passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        dom.logoutBtn.addEventListener('click', logout);

        // ============================================================
        // ОТОБРАЖЕНИЕ
        // ============================================================
        function renderAll() {
            renderNews();
            renderSchedule();
            renderVideos();
        }

        // ----- Новости -----
        function renderNews() {
            if (!isAdmin) return;
            const container = dom.newsList;
            container.innerHTML = '';
            newsData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'panel__item';
                el.innerHTML = `
                    <span class="panel__item-text"><strong>${item.date}</strong> — ${item.text} ${item.badge ? '[' + item.badge + ']' : ''}</span>
                    <div class="panel__item-actions">
                        <button class="edit" data-id="${item.id}">✏️</button>
                        <button class="delete" data-id="${item.id}">🗑️</button>
                    </div>
                `;
                container.appendChild(el);
            });

            container.querySelectorAll('.edit').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = newsData.find(n => n.id === id);
                    if (item) {
                        dom.newsEditId.value = item.id;
                        dom.newsDate.value = item.date;
                        dom.newsText.value = item.text;
                        dom.newsBadge.value = item.badge || '';
                        dom.newsSubmitBtn.textContent = '💾 Сохранить';
                    }
                });
            });

            container.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    if (confirm('Удалить новость?')) {
                        newsData = newsData.filter(n => n.id !== id);
                        saveData('news', newsData);
                        renderNews();
                        resetNewsForm();
                    }
                });
            });
        }

        function resetNewsForm() {
            dom.newsEditId.value = '';
            dom.newsDate.value = '';
            dom.newsText.value = '';
            dom.newsBadge.value = '';
            dom.newsSubmitBtn.textContent = '➕ Добавить';
        }

        dom.newsForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const id = parseInt(dom.newsEditId.value);
            const date = dom.newsDate.value.trim();
            const text = dom.newsText.value.trim();
            const badge = dom.newsBadge.value.trim();
            if (!date || !text) return alert('Заполните дату и текст');

            if (id) {
                const item = newsData.find(n => n.id === id);
                if (item) { item.date = date; item.text = text; item.badge = badge; }
            } else {
                newsData.push({ id: nextNewsId++, date, text, badge });
            }
            saveData('news', newsData);
            renderNews();
            resetNewsForm();
        });

        // ----- Программа передач -----
        function renderSchedule() {
            if (!isAdmin) return;
            const container = dom.scheduleList;
            container.innerHTML = '';
            scheduleData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'panel__item';
                el.innerHTML = `
                    <span class="panel__item-text"><strong>${item.time}</strong> — ${item.program}</span>
                    <div class="panel__item-actions">
                        <button class="edit" data-id="${item.id}">✏️</button>
                        <button class="delete" data-id="${item.id}">🗑️</button>
                    </div>
                `;
                container.appendChild(el);
            });

            container.querySelectorAll('.edit').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = scheduleData.find(s => s.id === id);
                    if (item) {
                        dom.scheduleEditId.value = item.id;
                        dom.scheduleTime.value = item.time;
                        dom.scheduleProgram.value = item.program;
                        dom.scheduleSubmitBtn.textContent = '💾 Сохранить';
                    }
                });
            });

            container.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    if (confirm('Удалить программу?')) {
                        scheduleData = scheduleData.filter(s => s.id !== id);
                        saveData('schedule', scheduleData);
                        renderSchedule();
                        resetScheduleForm();
                    }
                });
            });
        }

        function resetScheduleForm() {
            dom.scheduleEditId.value = '';
            dom.scheduleTime.value = '';
            dom.scheduleProgram.value = '';
            dom.scheduleSubmitBtn.textContent = '➕ Добавить';
        }

        dom.scheduleForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const id = parseInt(dom.scheduleEditId.value);
            const time = dom.scheduleTime.value.trim();
            const program = dom.scheduleProgram.value.trim();
            if (!time || !program) return alert('Заполните время и название');

            if (id) {
                const item = scheduleData.find(s => s.id === id);
                if (item) { item.time = time; item.program = program; }
            } else {
                scheduleData.push({ id: nextScheduleId++, time, program });
            }
            scheduleData.sort((a, b) => a.time.localeCompare(b.time));
            saveData('schedule', scheduleData);
            renderSchedule();
            resetScheduleForm();
        });

        // ----- Видео -----
        function renderVideos() {
            if (!isAdmin) return;
            const container = dom.videoList;
            container.innerHTML = '';
            videoData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'panel__item';
                el.innerHTML = `
                    <span class="panel__item-text"><strong>${item.title}</strong> (${item.date})</span>
                    <div class="panel__item-actions">
                        <button class="edit" data-id="${item.id}">✏️</button>
                        <button class="delete" data-id="${item.id}">🗑️</button>
                    </div>
                `;
                container.appendChild(el);
            });

            container.querySelectorAll('.edit').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = videoData.find(v => v.id === id);
                    if (item) {
                        dom.videoEditId.value = item.id;
                        dom.videoTitle.value = item.title;
                        dom.videoDate.value = item.date;
                        dom.videoUrl.value = item.url;
                        dom.videoSubmitBtn.textContent = '💾 Сохранить';
                    }
                });
            });

            container.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    if (confirm('Удалить видео?')) {
                        videoData = videoData.filter(v => v.id !== id);
                        saveData('videos', videoData);
                        renderVideos();
                        resetVideoForm();
                    }
                });
            });
        }

        function resetVideoForm() {
            dom.videoEditId.value = '';
            dom.videoTitle.value = '';
            dom.videoDate.value = '';
            dom.videoUrl.value = '';
            dom.videoSubmitBtn.textContent = '➕ Добавить';
        }

        dom.videoForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const id = parseInt(dom.videoEditId.value);
            const title = dom.videoTitle.value.trim();
            const date = dom.videoDate.value.trim();
            const url = dom.videoUrl.value.trim();
            if (!title || !date || !url) return alert('Заполните все поля');

            if (id) {
                const item = videoData.find(v => v.id === id);
                if (item) { item.title = title; item.date = date; item.url = url; }
            } else {
                videoData.push({ id: nextVideoId++, title, date, url });
            }
            saveData('videos', videoData);
            renderVideos();
            resetVideoForm();
        });

        // ============================================================
        // СБРОС
        // ============================================================
        dom.resetBtn.addEventListener('click', function() {
            if (!isAdmin) return;
            if (confirm('ВНИМАНИЕ! Это удалит все изменения. Продолжить?')) {
                if (confirm('Вы уверены?')) {
                    localStorage.removeItem('smcNight_news');
                    localStorage.removeItem('smcNight_schedule');
                    localStorage.removeItem('smcNight_videos');
                    newsData = DEFAULT_NEWS;
                    scheduleData = DEFAULT_SCHEDULE;
                    videoData = DEFAULT_VIDEOS;
                    nextNewsId = newsData.length ? Math.max(...newsData.map(n => n.id)) + 1 : 1;
                    nextScheduleId = scheduleData.length ? Math.max(...scheduleData.map(s => s.id)) + 1 : 1;
                    nextVideoId = videoData.length ? Math.max(...videoData.map(v => v.id)) + 1 : 1;
                    renderAll();
                    alert('✅ Данные сброшены');
                }
            }
        });

        // ============================================================
        // ЭФИР
        // ============================================================
        let isOffline = false;

        function toggleStream() {
            isOffline = !isOffline;
            dom.toggleOffline.textContent = isOffline ? '🟢 Включить эфир' : '🔴 Выключить эфир';
            dom.toggleOffline.style.background = isOffline ? '#2d9b5e' : '#e8a838';
            dom.streamStatus.textContent = isOffline ? '🔴 Эфир не идёт' : '🟢 В эфире';
            dom.streamStatus.style.color = isOffline ? '#d45a5a' : '#2d9b5e';
            try { localStorage.setItem('smcNight_offline', isOffline ? 'true' : 'false'); } catch (e) {}
        }

        function loadStreamState() {
            try {
                const state = localStorage.getItem('smcNight_offline');
                if (state === 'true') {
                    isOffline = true;
                    dom.toggleOffline.textContent = '🟢 Включить эфир';
                    dom.toggleOffline.style.background = '#2d9b5e';
                    dom.streamStatus.textContent = '🔴 Эфир не идёт';
                    dom.streamStatus.style.color = '#d45a5a';
                }
            } catch (e) {}
        }

        dom.toggleOffline.addEventListener('click', toggleStream);

        // ============================================================
        // ТЕМА
        // ============================================================
        function setTheme(theme) {
            const isDark = theme === 'dark';
            document.body.classList.toggle('dark', isDark);
            dom.themeToggle.textContent = isDark ? '🌙 Тёмная' : '☀️ Светлая';
            try { localStorage.setItem('smcNight-theme', theme); } catch (e) {}
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }

        function loadTheme() {
            try {
                const saved = localStorage.getItem('smcNight-theme');
                if (saved) setTheme(saved);
            } catch (e) {}
        }

        dom.themeToggle.addEventListener('click', toggleTheme);

        // ============================================================
        // ЗАПУСК
        // ============================================================
        loadTheme();
        checkAuth();

        console.log('✅ smcNight — админ-панель загружена');
        console.log('🔐 Пароль по умолчанию: smcNight2025');

    })();
</script>

</body>
</html>
