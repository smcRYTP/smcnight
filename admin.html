<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>smcNight — Панель управления</title>

    <style>
        /* ============================================================
                   ROOT VARIABLES
                   ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #f5f8fc;
            --color-bg-card: #ffffff;
            --color-bg-header: #ffffff;
            --color-bg-nav: #e9eff6;
            --color-text: #1a2a3e;
            --color-text-secondary: #5a7a9a;
            --color-text-muted: #8aaac0;
            --color-accent: #2b7be4;
            --color-accent-hover: #1a5fb0;
            --color-accent-light: #dce8f8;
            --color-border: #d0ddee;
            --color-border-hover: #b0c8e0;
            --color-shadow: rgba(26, 42, 62, 0.06);
            --color-shadow-hover: rgba(26, 42, 62, 0.12);
            --color-danger: #d45a5a;
            --color-success: #2d9b5e;
            --color-warning: #e8a838;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 2px 12px var(--color-shadow);
            --shadow-hover: 0 8px 32px var(--color-shadow-hover);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --max-width: 900px;
            --font: 'Segoe UI', 'Segoe UI Web', -apple-system, BlinkMacSystemFont, 
                   'Roboto', 'Helvetica Neue', Arial, sans-serif;
            --padding-body: 20px;
            --padding-card: 28px 32px;
            --padding-header: 16px 28px;
        }

        [data-theme="dark"] {
            --color-bg: #0d1a2b;
            --color-bg-card: #152a40;
            --color-bg-header: #0f1f32;
            --color-bg-nav: #1a2f45;
            --color-text: #e8f0f8;
            --color-text-secondary: #90b0d0;
            --color-text-muted: #6080a0;
            --color-accent: #4a9eff;
            --color-accent-hover: #6db4ff;
            --color-accent-light: #1a3a5c;
            --color-border: #2a4a6a;
            --color-border-hover: #3a5a7a;
            --color-shadow: rgba(0, 0, 0, 0.3);
            --color-shadow-hover: rgba(0, 0, 0, 0.5);
            --color-success: #44bb77;
            --color-warning: #d4a838;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            line-height: 1.6;
            padding: var(--padding-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            max-width: var(--max-width);
            margin: 0 auto 24px;
            background: var(--color-bg-header);
            border-radius: var(--radius-lg);
            padding: var(--padding-header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
        }

        .header__logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text);
            transition: color var(--transition);
        }

        .header__logo span {
            color: var(--color-accent);
        }

        .header__actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header__back {
            background: var(--color-bg-nav);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            text-decoration: none;
            display: inline-block;
        }

        .header__back:hover {
            background: var(--color-accent-light);
            border-color: var(--color-accent);
            transform: translateY(-1px);
        }

        .theme-toggle {
            background: var(--color-bg-nav);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }

        .theme-toggle:hover {
            background: var(--color-accent-light);
            border-color: var(--color-accent);
            transform: translateY(-1px);
        }

        .theme-toggle:active {
            transform: scale(0.97);
        }

        /* ============================================================
                   ADMIN AUTH
                   ============================================================ */
        .admin-auth {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: var(--color-bg-card);
            border-radius: var(--radius-lg);
            border: 2px solid var(--color-accent);
            box-shadow: var(--shadow-hover);
            text-align: center;
        }

        .admin-auth.hidden {
            display: none;
        }

        .admin-auth__title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--color-text);
        }

        .admin-auth__input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            margin-bottom: 12px;
            transition: all var(--transition);
        }

        .admin-auth__input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-light);
        }

        .admin-auth__btn {
            width: 100%;
            padding: 12px;
            background: var(--color-accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .admin-auth__btn:hover {
            background: var(--color-accent-hover);
            transform: scale(1.02);
        }

        .admin-auth__error {
            color: var(--color-danger);
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .admin-auth__error.show {
            display: block;
        }

        /* ============================================================
                   ADMIN PANEL
                   ============================================================ */
        .admin-panel {
            display: none;
            background: var(--color-bg-card);
            border-radius: var(--radius-lg);
            padding: var(--padding-card);
            border: 2px solid var(--color-accent);
            box-shadow: var(--shadow-hover);
            margin-bottom: 24px;
        }

        .admin-panel.show {
            display: block;
        }

        .admin-panel__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--color-border);
        }

        .admin-panel__title {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-accent);
        }

        .admin-panel__toggle {
            background: var(--color-accent);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .admin-panel__toggle:hover {
            background: var(--color-accent-hover);
            transform: scale(1.03);
        }

        .admin-panel__section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--color-border);
        }

        .admin-panel__section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .admin-panel__section-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text);
        }

        .admin-panel__form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .admin-panel__form input,
        .admin-panel__form textarea {
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 14px;
            background: var(--color-bg);
            color: var(--color-text);
            transition: all var(--transition);
            flex: 1 1 200px;
        }

        .admin-panel__form input:focus,
        .admin-panel__form textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-light);
        }

        .admin-panel__form textarea {
            flex-basis: 100%;
            min-height: 60px;
            resize: vertical;
        }

        .admin-panel__form button {
            padding: 10px 20px;
            background: var(--color-accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }

        .admin-panel__form button:hover {
            background: var(--color-accent-hover);
            transform: scale(1.03);
        }

        .admin-panel__form button.danger {
            background: var(--color-danger);
        }

        .admin-panel__form button.danger:hover {
            background: #b33a3a;
        }

        .admin-panel__list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
        }

        .admin-panel__list::-webkit-scrollbar {
            width: 4px;
        }

        .admin-panel__list::-webkit-scrollbar-track {
            background: var(--color-border);
            border-radius: 10px;
        }

        .admin-panel__list::-webkit-scrollbar-thumb {
            background: var(--color-accent);
            border-radius: 10px;
        }

        .admin-panel__item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--color-bg-nav);
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            font-size: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-panel__item-text {
            flex: 1;
            min-width: 100px;
        }

        .admin-panel__item-actions {
            display: flex;
            gap: 6px;
        }

        .admin-panel__item-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .admin-panel__item-actions .edit {
            background: var(--color-warning);
            color: #fff;
        }

        .admin-panel__item-actions .edit:hover {
            opacity: 0.8;
        }

        .admin-panel__item-actions .delete {
            background: var(--color-danger);
            color: #fff;
        }

        .admin-panel__item-actions .delete:hover {
            opacity: 0.8;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 820px) {
            :root {
                --padding-body: 14px;
                --padding-card: 20px;
                --padding-header: 14px 18px;
            }
            .header { flex-direction: column; align-items: center; gap: 10px; }
            .header__logo { font-size: 20px; }
            .admin-panel__form { flex-direction: column; }
            .admin-panel__form input,
            .admin-panel__form textarea { flex-basis: auto; width: 100%; }
            .admin-panel__form button { width: 100%; }
            .admin-panel__item { flex-direction: column; align-items: stretch; }
            .admin-panel__item-actions { justify-content: flex-end; }
        }

        @media (max-width: 480px) {
            :root {
                --padding-body: 10px;
                --padding-card: 14px;
                --padding-header: 12px 14px;
            }
            .header__logo { font-size: 18px; }
            .admin-panel { padding: 12px; }
            .admin-panel__title { font-size: 17px; }
            .admin-panel__section-title { font-size: 15px; }
            .admin-auth { padding: 20px; margin: 20px auto; }
        }

        * {
            transition: background var(--transition), color var(--transition), 
                        border-color var(--transition), box-shadow var(--transition),
                        padding 0.2s ease, margin 0.2s ease, font-size 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <header class="header">
            <div class="header__logo">smc<span>Night</span> <span style="font-size:14px; font-weight:400; color:var(--color-text-secondary);">— админ-панель</span></div>
            <div class="header__actions">
                <a href="index.html" class="header__back">← На сайт</a>
                <button class="theme-toggle" id="themeToggle">
                    <span id="themeIcon">☀️</span>
                    <span id="themeLabel">Светлая</span>
                </button>
            </div>
        </header>

        <!-- ============================================================
        ADMIN AUTH (вход по паролю)
        ============================================================ -->
        <div class="admin-auth" id="adminAuth">
            <div class="admin-auth__title">🔐 Доступ к панели управления</div>
            <input type="password" class="admin-auth__input" id="adminPassword" placeholder="Введите пароль" />
            <button class="admin-auth__btn" id="adminAuthBtn">Войти</button>
            <div class="admin-auth__error" id="adminAuthError">❌ Неверный пароль</div>
        </div>

        <!-- ============================================================
        ADMIN PANEL (показывается после входа)
        ============================================================ -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-panel__header">
                <span class="admin-panel__title">🔧 Панель управления</span>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="admin-panel__toggle" id="resetData" style="background:var(--color-danger);">Сбросить всё</button>
                    <button class="admin-panel__toggle" id="logoutBtn" style="background:var(--color-text-muted);">🚪 Выйти</button>
                </div>
            </div>

            <!-- Новости -->
            <div class="admin-panel__section">
                <div class="admin-panel__section-title">📰 Управление новостями</div>
                <form class="admin-panel__form" id="newsForm">
                    <input type="hidden" id="newsEditId" value="">
                    <input type="text" id="newsDate" placeholder="Дата (например: 24.08.2026)" required>
                    <input type="text" id="newsText" placeholder="Текст новости" required>
                    <input type="text" id="newsBadge" placeholder="Бейдж (необязательно)">
                    <button type="submit" id="newsSubmitBtn">➕ Добавить</button>
                </form>
                <div class="admin-panel__list" id="newsList"></div>
            </div>

            <!-- Программа передач -->
            <div class="admin-panel__section">
                <div class="admin-panel__section-title">📅 Управление программой передач</div>
                <form class="admin-panel__form" id="scheduleForm">
                    <input type="hidden" id="scheduleEditId" value="">
                    <input type="text" id="scheduleTime" placeholder="Время (например: 00:00)" required>
                    <input type="text" id="scheduleProgram" placeholder="Название программы" required>
                    <button type="submit" id="scheduleSubmitBtn">➕ Добавить</button>
                </form>
                <div class="admin-panel__list" id="scheduleList"></div>
            </div>

            <!-- Видео -->
            <div class="admin-panel__section">
                <div class="admin-panel__section-title">🎬 Управление видео в контенте</div>
                <form class="admin-panel__form" id="videoForm">
                    <input type="hidden" id="videoEditId" value="">
                    <input type="text" id="videoTitle" placeholder="Название программы" required>
                    <input type="text" id="videoDate" placeholder="Дата (например: 24.08.2026)" required>
                    <input type="text" id="videoUrl" placeholder="Ссылка на видео (YouTube, VK, etc.)" required>
                    <button type="submit" id="videoSubmitBtn">➕ Добавить</button>
                </form>
                <div class="admin-panel__list" id="videoList"></div>
            </div>

            <!-- Управление эфиром -->
            <div class="admin-panel__section">
                <div class="admin-panel__section-title">📡 Управление эфиром</div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button class="admin-panel__toggle" id="toggleOffline" style="background:var(--color-warning); color:#fff;">🔴 Выключить эфир</button>
                    <span style="color:var(--color-text-secondary); font-size:14px; align-self:center;">
                        Статус: <span id="streamStatus">🟢 В эфире</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- ============================================================
        FOOTER
        ============================================================ -->
        <footer class="footer" style="text-align:center; color:var(--color-text-muted); font-size:14px; padding:20px 0; border-top:1px solid var(--color-border); margin-top:20px;">
            <p>© 2025–2026 <strong>smcNight</strong> — интернет-канал.</p>
        </footer>

    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // НАСТРОЙКИ (пароль)
            // ============================================================
            const ADMIN_PASSWORD = '0607202416042025'; // ← СМЕНИТЕ НА СВОЙ ПАРОЛЬ!

            // ============================================================
            // ДАННЫЕ ПО УМОЛЧАНИЮ
            // ============================================================
            const DEFAULT_NEWS = [
                { id: 1, date: '24.08.2026', text: 'Запускаем новый формат — «Ночной джаз» по пятницам!', badge: 'новое' },
                { id: 2, date: '23.08.2026', text: 'Техническое обновление: улучшено качество трансляции.', badge: '' },
                { id: 3, date: '22.08.2026', text: 'smcNight теперь в Telegram-канале.', badge: 'важно' },
                { id: 4, date: '20.08.2026', text: 'Конкурс: присылайте свои клипы для эфира.', badge: '' },
                { id: 5, date: '18.08.2026', text: 'Новый ведущий в вечернем стриме — Андрей Н.', badge: '' },
            ];

            const DEFAULT_SCHEDULE = [
                { id: 1, time: '00:00', program: 'Ночной джаз' },
                { id: 2, time: '02:00', program: 'Киноклуб: триллер' },
                { id: 3, time: '04:30', program: 'Акустика' },
                { id: 4, time: '07:00', program: 'Утреннее шоу' },
                { id: 5, time: '10:00', program: 'Новости smc' },
                { id: 6, time: '12:00', program: 'Обеденный перерыв' },
                { id: 7, time: '14:00', program: 'Техно-микс' },
                { id: 8, time: '17:00', program: 'Вечерний стрим' },
                { id: 9, time: '20:00', program: 'Премьера' },
                { id: 10, time: '22:00', program: 'Ночной эфир' },
            ];

            const DEFAULT_VIDEOS = [
                { id: 1, title: 'Ночной джаз', date: '24.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 2, title: 'Киноклуб: триллер', date: '23.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 3, title: 'Акустика', date: '22.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 4, title: 'Утреннее шоу', date: '21.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 5, title: 'Техно-микс', date: '20.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 6, title: 'Вечерний стрим', date: '19.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 7, title: 'Премьера', date: '18.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                { id: 8, title: 'Ночной эфир', date: '17.08.2026', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
            ];

            // ============================================================
            // РАБОТА С LOCALSTORAGE
            // ============================================================
            function getData(key, defaultData) {
                try {
                    const stored = localStorage.getItem('smcNight_' + key);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed;
                        }
                    }
                } catch (e) {}
                saveData(key, defaultData);
                return defaultData;
            }

            function saveData(key, data) {
                try {
                    localStorage.setItem('smcNight_' + key, JSON.stringify(data));
                } catch (e) {}
            }

            let newsData = getData('news', DEFAULT_NEWS);
            let scheduleData = getData('schedule', DEFAULT_SCHEDULE);
            let videoData = getData('videos', DEFAULT_VIDEOS);

            let nextNewsId = newsData.length ? Math.max(...newsData.map(n => n.id)) + 1 : 1;
            let nextScheduleId = scheduleData.length ? Math.max(...scheduleData.map(s => s.id)) + 1 : 1;
            let nextVideoId = videoData.length ? Math.max(...videoData.map(v => v.id)) + 1 : 1;

            // ============================================================
            // DOM
            // ============================================================
            const dom = {
                // Auth
                adminAuth: document.getElementById('adminAuth'),
                adminPassword: document.getElementById('adminPassword'),
                adminAuthBtn: document.getElementById('adminAuthBtn'),
                adminAuthError: document.getElementById('adminAuthError'),
                // Admin panel
                adminPanel: document.getElementById('adminPanel'),
                resetData: document.getElementById('resetData'),
                logoutBtn: document.getElementById('logoutBtn'),
                // News
                newsForm: document.getElementById('newsForm'),
                newsList: document.getElementById('newsList'),
                newsEditId: document.getElementById('newsEditId'),
                newsDate: document.getElementById('newsDate'),
                newsText: document.getElementById('newsText'),
                newsBadge: document.getElementById('newsBadge'),
                newsSubmitBtn: document.getElementById('newsSubmitBtn'),
                // Schedule
                scheduleForm: document.getElementById('scheduleForm'),
                scheduleList: document.getElementById('scheduleList'),
                scheduleEditId: document.getElementById('scheduleEditId'),
                scheduleTime: document.getElementById('scheduleTime'),
                scheduleProgram: document.getElementById('scheduleProgram'),
                scheduleSubmitBtn: document.getElementById('scheduleSubmitBtn'),
                // Videos
                videoForm: document.getElementById('videoForm'),
                videoList: document.getElementById('videoList'),
                videoEditId: document.getElementById('videoEditId'),
                videoTitle: document.getElementById('videoTitle'),
                videoDate: document.getElementById('videoDate'),
                videoUrl: document.getElementById('videoUrl'),
                videoSubmitBtn: document.getElementById('videoSubmitBtn'),
                // Theme
                themeToggle: document.getElementById('themeToggle'),
                themeIcon: document.getElementById('themeIcon'),
                themeLabel: document.getElementById('themeLabel'),
                // Stream
                toggleOffline: document.getElementById('toggleOffline'),
                streamStatus: document.getElementById('streamStatus'),
            };

            // ============================================================
            // АДМИН-АВТОРИЗАЦИЯ
            // ============================================================
            let isAdmin = false;

            function checkAuth() {
                try {
                    const saved = localStorage.getItem('smcNight_admin_auth');
                    if (saved === 'true') {
                        isAdmin = true;
                        dom.adminAuth.classList.add('hidden');
                        dom.adminPanel.classList.add('show');
                        renderAdminNews();
                        renderAdminSchedule();
                        renderAdminVideos();
                        loadStreamState();
                        return true;
                    }
                } catch (e) {}
                dom.adminAuth.classList.remove('hidden');
                dom.adminPanel.classList.remove('show');
                return false;
            }

            function loginAdmin() {
                const password = dom.adminPassword.value.trim();
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    localStorage.setItem('smcNight_admin_auth', 'true');
                    dom.adminAuth.classList.add('hidden');
                    dom.adminAuthError.classList.remove('show');
                    dom.adminPanel.classList.add('show');
                    dom.adminPassword.value = '';
                    renderAdminNews();
                    renderAdminSchedule();
                    renderAdminVideos();
                    loadStreamState();
                } else {
                    dom.adminAuthError.classList.add('show');
                    dom.adminPassword.value = '';
                    dom.adminPassword.focus();
                }
            }

            function logoutAdmin() {
                isAdmin = false;
                localStorage.removeItem('smcNight_admin_auth');
                dom.adminPanel.classList.remove('show');
                dom.adminAuth.classList.remove('hidden');
                dom.adminAuthError.classList.remove('show');
                dom.adminPassword.value = '';
            }

            // ============================================================
            // ОТОБРАЖЕНИЕ ДАННЫХ В АДМИНКЕ
            // ============================================================

            // ----- Новости -----
            function renderAdminNews() {
                if (!isAdmin) return;
                const container = dom.newsList;
                container.innerHTML = '';
                newsData.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'admin-panel__item';
                    el.innerHTML = `
                        <span class="admin-panel__item-text">
                            <strong>${item.date}</strong> — ${item.text} ${item.badge ? '[' + item.badge + ']' : ''}
                        </span>
                        <div class="admin-panel__item-actions">
                            <button class="edit" data-id="${item.id}">✏️</button>
                            <button class="delete" data-id="${item.id}">🗑️</button>
                        </div>
                    `;
                    container.appendChild(el);
                });

                container.querySelectorAll('.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const item = newsData.find(n => n.id === id);
                        if (item) {
                            dom.newsEditId.value = item.id;
                            dom.newsDate.value = item.date;
                            dom.newsText.value = item.text;
                            dom.newsBadge.value = item.badge || '';
                            dom.newsSubmitBtn.textContent = '💾 Сохранить';
                        }
                    });
                });

                container.querySelectorAll('.delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('Удалить новость?')) {
                            newsData = newsData.filter(n => n.id !== id);
                            saveData('news', newsData);
                            renderAdminNews();
                            resetNewsForm();
                            // Обновляем отображение на главной (через localStorage)
                        }
                    });
                });
            }

            function resetNewsForm() {
                dom.newsEditId.value = '';
                dom.newsDate.value = '';
                dom.newsText.value = '';
                dom.newsBadge.value = '';
                dom.newsSubmitBtn.textContent = '➕ Добавить';
            }

            // ----- Программа передач -----
            function renderAdminSchedule() {
                if (!isAdmin) return;
                const container = dom.scheduleList;
                container.innerHTML = '';
                scheduleData.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'admin-panel__item';
                    el.innerHTML = `
                        <span class="admin-panel__item-text">
                            <strong>${item.time}</strong> — ${item.program}
                        </span>
                        <div class="admin-panel__item-actions">
                            <button class="edit" data-id="${item.id}">✏️</button>
                            <button class="delete" data-id="${item.id}">🗑️</button>
                        </div>
                    `;
                    container.appendChild(el);
                });

                container.querySelectorAll('.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const item = scheduleData.find(s => s.id === id);
                        if (item) {
                            dom.scheduleEditId.value = item.id;
                            dom.scheduleTime.value = item.time;
                            dom.scheduleProgram.value = item.program;
                            dom.scheduleSubmitBtn.textContent = '💾 Сохранить';
                        }
                    });
                });

                container.querySelectorAll('.delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('Удалить программу?')) {
                            scheduleData = scheduleData.filter(s => s.id !== id);
                            saveData('schedule', scheduleData);
                            renderAdminSchedule();
                            resetScheduleForm();
                        }
                    });
                });
            }

            function resetScheduleForm() {
                dom.scheduleEditId.value = '';
                dom.scheduleTime.value = '';
                dom.scheduleProgram.value = '';
                dom.scheduleSubmitBtn.textContent = '➕ Добавить';
            }

            // ----- Видео -----
            function renderAdminVideos() {
                if (!isAdmin) return;
                const container = dom.videoList;
                container.innerHTML = '';
                videoData.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'admin-panel__item';
                    el.innerHTML = `
                        <span class="admin-panel__item-text">
                            <strong>${item.title}</strong> (${item.date})
                        </span>
                        <div class="admin-panel__item-actions">
                            <button class="edit" data-id="${item.id}">✏️</button>
                            <button class="delete" data-id="${item.id}">🗑️</button>
                        </div>
                    `;
                    container.appendChild(el);
                });

                container.querySelectorAll('.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const item = videoData.find(v => v.id === id);
                        if (item) {
                            dom.videoEditId.value = item.id;
                            dom.videoTitle.value = item.title;
                            dom.videoDate.value = item.date;
                            dom.videoUrl.value = item.url;
                            dom.videoSubmitBtn.textContent = '💾 Сохранить';
                        }
                    });
                });

                container.querySelectorAll('.delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        if (confirm('Удалить видео?')) {
                            videoData = videoData.filter(v => v.id !== id);
                            saveData('videos', videoData);
                            renderAdminVideos();
                            resetVideoForm();
                        }
                    });
                });
            }

            function resetVideoForm() {
                dom.videoEditId.value = '';
                dom.videoTitle.value = '';
                dom.videoDate.value = '';
                dom.videoUrl.value = '';
                dom.videoSubmitBtn.textContent = '➕ Добавить';
            }

            // ============================================================
            // УПРАВЛЕНИЕ ЭФИРОМ
            // ============================================================
            let isOffline = false;

            function toggleStream() {
                isOffline = !isOffline;
                dom.toggleOffline.textContent = isOffline ? '🟢 Включить эфир' : '🔴 Выключить эфир';
                dom.toggleOffline.style.background = isOffline ? 'var(--color-success)' : 'var(--color-warning)';
                dom.streamStatus.textContent = isOffline ? '🔴 Эфир не идёт' : '🟢 В эфире';
                dom.streamStatus.style.color = isOffline ? 'var(--color-danger)' : 'var(--color-success)';
                try {
                    localStorage.setItem('smcNight_offline', isOffline ? 'true' : 'false');
                } catch (_) {}
            }

            function loadStreamState() {
                try {
                    const state = localStorage.getItem('smcNight_offline');
                    if (state === 'true') {
                        isOffline = true;
                        dom.toggleOffline.textContent = '🟢 Включить эфир';
                        dom.toggleOffline.style.background = 'var(--color-success)';
                        dom.streamStatus.textContent = '🔴 Эфир не идёт';
                        dom.streamStatus.style.color = 'var(--color-danger)';
                    } else {
                        isOffline = false;
                        dom.toggleOffline.textContent = '🔴 Выключить эфир';
                        dom.toggleOffline.style.background = 'var(--color-warning)';
                        dom.streamStatus.textContent = '🟢 В эфире';
                        dom.streamStatus.style.color = 'var(--color-success)';
                    }
                } catch (_) {}
            }

            // ============================================================
            // ТЕМА
            // ============================================================
            function setTheme(theme) {
                const isDark = theme === 'dark';
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
                dom.themeIcon.textContent = isDark ? '🌙' : '☀️';
                dom.themeLabel.textContent = isDark ? 'Тёмная' : 'Светлая';
                try {
                    localStorage.setItem('smcNight-theme', theme);
                } catch (_) {}
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                setTheme(next);
            }

            function loadTheme() {
                let saved = 'light';
                try {
                    const stored = localStorage.getItem('smcNight-theme');
                    if (stored === 'dark' || stored === 'light') {
                        saved = stored;
                    }
                } catch (_) {}
                setTheme(saved);
            }

            // ============================================================
            // СОБЫТИЯ ФОРМ
            // ============================================================

            // ----- Новости -----
            dom.newsForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!isAdmin) return;
                const id = parseInt(dom.newsEditId.value);
                const date = dom.newsDate.value.trim();
                const text = dom.newsText.value.trim();
                const badge = dom.newsBadge.value.trim();

                if (!date || !text) return alert('Заполните дату и текст новости');

                if (id) {
                    const item = newsData.find(n => n.id === id);
                    if (item) {
                        item.date = date;
                        item.text = text;
                        item.badge = badge;
                    }
                } else {
                    newsData.push({ id: nextNewsId++, date, text, badge });
                }

                saveData('news', newsData);
                renderAdminNews();
                resetNewsForm();
            });

            // ----- Программа передач -----
            dom.scheduleForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!isAdmin) return;
                const id = parseInt(dom.scheduleEditId.value);
                const time = dom.scheduleTime.value.trim();
                const program = dom.scheduleProgram.value.trim();

                if (!time || !program) return alert('Заполните время и название программы');

                if (id) {
                    const item = scheduleData.find(s => s.id === id);
                    if (item) {
                        item.time = time;
                        item.program = program;
                    }
                } else {
                    scheduleData.push({ id: nextScheduleId++, time, program });
                }

                scheduleData.sort((a, b) => a.time.localeCompare(b.time));

                saveData('schedule', scheduleData);
                renderAdminSchedule();
                resetScheduleForm();
            });

            // ----- Видео -----
            dom.videoForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!isAdmin) return;
                const id = parseInt(dom.videoEditId.value);
                const title = dom.videoTitle.value.trim();
                const date = dom.videoDate.value.trim();
                const url = dom.videoUrl.value.trim();

                if (!title || !date || !url) return alert('Заполните все поля');

                if (id) {
                    const item = videoData.find(v => v.id === id);
                    if (item) {
                        item.title = title;
                        item.date = date;
                        item.url = url;
                    }
                } else {
                    videoData.push({ id: nextVideoId++, title, date, url });
                }

                saveData('videos', videoData);
                renderAdminVideos();
                resetVideoForm();
            });

            // ============================================================
            // КНОПКА СБРОСА
            // ============================================================
            dom.resetData.addEventListener('click', function() {
                if (!isAdmin) return;
                if (confirm('ВНИМАНИЕ! Это удалит все ваши изменения и восстановит данные по умолчанию. Продолжить?')) {
                    if (confirm('Вы уверены? Данные будут потеряны безвозвратно.')) {
                        localStorage.removeItem('smcNight_news');
                        localStorage.removeItem('smcNight_schedule');
                        localStorage.removeItem('smcNight_videos');
                        newsData = DEFAULT_NEWS;
                        scheduleData = DEFAULT_SCHEDULE;
                        videoData = DEFAULT_VIDEOS;
                        nextNewsId = newsData.length ? Math.max(...newsData.map(n => n.id)) + 1 : 1;
                        nextScheduleId = scheduleData.length ? Math.max(...scheduleData.map(s => s.id)) + 1 : 1;
                        nextVideoId = videoData.length ? Math.max(...videoData.map(v => v.id)) + 1 : 1;
                        renderAdminNews();
                        renderAdminSchedule();
                        renderAdminVideos();
                        alert('✅ Данные сброшены до заводских настроек');
                    }
                }
            });

            // ============================================================
            // АВТОРИЗАЦИЯ
            // ============================================================
            dom.adminAuthBtn.addEventListener('click', loginAdmin);
            dom.adminPassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') loginAdmin();
            });

            dom.logoutBtn.addEventListener('click', logoutAdmin);

            // Управление эфиром
            dom.toggleOffline.addEventListener('click', toggleStream);

            // ============================================================
            // ИНИЦИАЛИЗАЦИЯ
            // ============================================================

            loadTheme();
            checkAuth();

            console.log('✅ smcNight — админ-панель загружена');
            console.log('📦 Загружено новостей: ' + newsData.length);
            console.log('📅 Загружено программ: ' + scheduleData.length);
            console.log('🎬 Загружено видео: ' + videoData.length);
            console.log('🔐 Пароль по умолчанию: smcNight2025');

        })();
    </script>

</body>
</html>
