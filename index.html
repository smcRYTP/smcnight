<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotTricolor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Мягкое фоновое свечение (основное) */
  body::before {
    content: "";
    position: absolute;
    width: 70vmax;
    height: 70vmax;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    animation: bgPulse 4s ease-in-out infinite;
  }

  /* --- ЭКРАН 1: ИНТРО С ДАТОЙ --- */
  .intro-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 100;
    overflow: hidden;
    animation: hideIntro 0.8s ease-in-out 3.2s forwards;
  }

  /* --- ФОН ИНТРО (ТЕМНО-ГОЛУБЫЕ КРУГИ) --- */
  
  .intro-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    /* Добавил анимацию появления (fadeInOrbs) перед анимацией плавания */
    animation: fadeInOrbs 1.5s ease-out forwards, floatOrb 12s ease-in-out infinite alternate 1.5s;
  }

  /* Первый круг */
  .orb-1 {
    width: 60vw;
    height: 60vw;
    max-width: 800px;
    max-height: 800px;
    background: radial-gradient(circle at 30% 30%, #0ea5e9, #0369a1, #082f49);
    top: -10%;
    left: -10%;
  }

  /* Второй круг */
  .orb-2 {
    width: 50vw;
    height: 50vw;
    max-width: 600px;
    max-height: 600px;
    background: radial-gradient(circle at 70% 70%, #38bdf8, #1d4ed8, #1e1b4b);
    bottom: -10%;
    right: -10%;
  }

  /* Третий круг */
  .orb-3 {
    width: 40vw;
    height: 40vw;
    max-width: 500px;
    max-height: 500px;
    background: radial-gradient(circle at 50% 50%, #e0f2fe, #0284c7, #0c4a6e);
    top: 50%;
    left: 60%;
  }

  /* Сама дата (поверх фона) */
  .intro-date {
    font-size: clamp(80px, 20vw, 200px);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 1;
    color: #ffffff;
    opacity: 0;
    position: relative;
    z-index: 2;
    text-shadow: 
      0 0 20px rgba(56, 189, 248, 0.6),
      0 0 40px rgba(56, 189, 248, 0.3),
      0 0 80px rgba(56, 189, 248, 0.1);
    animation: 
      introFadeIn 1s ease-out 0.2s forwards,
      introGlowPulse 2s ease-in-out 1.2s infinite;
  }

  /* --- ЭКРАН 2: ОСНОВНОЙ КОНТЕНТ --- */
  .main-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: showMain 1s ease-out 3.6s forwards;
  }

  /* Логотип со свечением (белое) */
  .logo-top {
    height: 120px;
    width: auto;
    margin-bottom: 2.5rem;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4)) 
            drop-shadow(0 0 40px rgba(255, 255, 255, 0.15)); 
    animation: logoGlow 3s ease-in-out infinite;
  }

  /* Главная карточка (БЕЗ СИНЕГО ГЛОУ) */
  .card {
    background: #0a0a0a;
    border: 1px solid #1f1f1f;
    border-radius: 20px;
    padding: 50px 40px;
    max-width: 580px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.8), 
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 0 30px rgba(255, 255, 255, 0.03); /* Только белый глоу */
    animation: cardGlow 4s ease-in-out infinite alternate;
  }

  /* Иконка */
  .icon-tools {
    font-size: 52px;
    margin-bottom: 24px;
    display: inline-block;
    filter: grayscale(100%) drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
    animation: float 3s ease-in-out infinite;
  }

  /* Заголовок */
  .card h1 {
    font-weight: 900;
    font-size: 32px;
    margin-bottom: 16px;
    color: #ffffff;
    letter-spacing: -0.03em;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }

  /* Основной текст */
  .card p {
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    color: #888888;
    margin-bottom: 24px;
  }

  .card p strong {
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); /* Белый глоу */
  }

  /* Разделитель (БЕЛЫЙ) */
  .divider {
    width: 40px;
    height: 2px;
    background: #ffffff;
    margin: 0 auto 24px auto;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.2);
    animation: dividerGlow 2s ease-in-out infinite alternate;
  }

  /* Мелкий текст */
  .thanks {
    font-weight: 600;
    font-size: 13px;
    color: #555555;
    margin-bottom: 32px;
    letter-spacing: 0.02em;
  }

  /* Кнопка */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 30px;
    padding: 12px 28px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
  }

  .btn:hover {
    background: #e0e0e0;
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.3), 0 0 50px rgba(255, 255, 255, 0.1); /* Белое свечение */
  }

  .btn:active {
    transform: translateY(0) scale(0.98);
  }

  /* Копирайт */
  .copyright {
    margin-top: 30px;
    font-weight: 600;
    font-size: 11px;
    color: #333333;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* --- АНИМАЦИИ --- */

  /* Появление кругов */
  @keyframes fadeInOrbs {
    from { opacity: 0; }
    to { opacity: 0.5; }
  }

  /* Плавание кругов (применяется индивидуально ниже) */
  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 30px) scale(1.1); }
  }

  @keyframes introFadeIn {
    from { opacity: 0; transform: scale(0.95); filter: blur(10px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  @keyframes introGlowPulse {
    0%, 100% { 
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4), 0 0 40px rgba(56, 189, 248, 0.2), 0 0 80px rgba(56, 189, 248, 0.1);
      transform: scale(1);
    }
    50% { 
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.7), 0 0 60px rgba(56, 189, 248, 0.4), 0 0 120px rgba(56, 189, 248, 0.2);
      transform: scale(1.02);
    }
  }

  @keyframes hideIntro {
    from { opacity: 1; visibility: visible; }
    to { opacity: 0; visibility: hidden; }
  }

  @keyframes showMain {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bgPulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* Индивидуальные анимации для плавания, чтобы они не двигались синхронно */
  .orb-1 { animation: fadeInOrbs 1.5s ease-out forwards, floatOrb1 12s ease-in-out infinite alternate 1.5s; }
  .orb-2 { animation: fadeInOrbs 1.5s ease-out 0.3s forwards, floatOrb2 15s ease-in-out infinite alternate 1.8s; }
  .orb-3 { animation: fadeInOrbs 1.5s ease-out 0.6s forwards, floatOrb3 10s ease-in-out infinite alternate 2.1s; }

  @keyframes floatOrb1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(100px, 50px) scale(1.1); }
  }

  @keyframes floatOrb2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-80px, -60px) scale(1.15); }
  }

  @keyframes floatOrb3 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, -80px) scale(1.2) rotate(45deg); }
  }

  @keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.1)); }
    50% { filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.5)) drop-shadow(0 0 60px rgba(255, 255, 255, 0.2)); }
  }

  @keyframes cardGlow {
    from { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 20px rgba(255, 255, 255, 0.02); }
    to { box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05), 0 0 40px rgba(255, 255, 255, 0.06); }
  }

  @keyframes dividerGlow {
    from { box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); opacity: 0.8; }
    to { box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); opacity: 1; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
</style>
</head>
<body>

  <!-- ЭКРАН 1: ИНТРО -->
  <div class="intro-screen">
    <div class="intro-orb orb-1"></div>
    <div class="intro-orb orb-2"></div>
    <div class="intro-orb orb-3"></div>
    
    <div class="intro-date">12.12</div>
  </div>

  <!-- ЭКРАН 2: ОСНОВНОЙ КОНТЕНТ -->
  <div class="main-content">
    
   <img src="logo.png" alt="Logo" class="logo-top">
    <div class="card">
      <div class="icon-tools">🛠️</div>

      <h1>А мы работаем</h1>
      
      <p>
        Мы закрыли сайт канала smcNight, так-как на его месте мы делаем <strong>медиа-платформу</strong> с каналами, контентом и другим.
      </p>

      <div class="divider"></div>

      <div class="thanks">
        За новостями следите в ТГК: t.me/smcNightik
      </div>

      <button class="btn" onclick="location.reload()">
        Проверить снова
      </button>

      <div class="copyright">
        smcRYTP © 2026
      </div>
    </div>
  </div>

</body>
</html>
