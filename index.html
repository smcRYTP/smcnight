<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="smcNight — сайт временно не работает" />
    <title>smcNight — сайт не работает</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d1a2b;
            color: #e8f0f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            overflow: hidden;
        }

        /* Фоновый градиент */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0d1a2b 0%, #122b4a 50%, #0d1a2b 100%);
            z-index: -1;
        }

        /* Пульсирующие круги на фоне */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(74, 158, 255, 0.08) 0%, transparent 40%);
            z-index: -1;
            animation: pulse-bg 8s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Логотип */
        .logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: #e8f0f8;
        }

        .logo span {
            color: #4a9eff;
        }

        .tagline {
            font-size: 13px;
            color: #90b0d0;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Карточка с сообщением */
        .card {
            background: rgba(21, 42, 64, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 158, 255, 0.2);
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Иконка */
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
            animation: pulse-icon 2s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% {
                transform: scale(1);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        /* Заголовок */
        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #e8f0f8;
            line-height: 1.3;
        }

        /* Текст */
        .text {
            font-size: 16px;
            color: #90b0d0;
            margin-bottom: 12px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .text strong {
            color: #4a9eff;
        }

        /* Разделитель */
        .divider {
            width: 60px;
            height: 3px;
            background: #4a9eff;
            border-radius: 3px;
            margin: 28px auto;
            opacity: 0.6;
        }

        /* Подпись */
        .footer-text {
            font-size: 14px;
            color: #6080a0;
            margin-top: 32px;
        }

        /* Анимированные точки */
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        /* Кнопка */
        .btn {
            display: inline-block;
            margin-top: 28px;
            padding: 12px 32px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-decoration: none;
        }

        .btn:hover {
            background: #6db4ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .logo {
                font-size: 32px;
            }

            .tagline {
                font-size: 11px;
                letter-spacing: 2px;
                margin-bottom: 28px;
            }

            .card {
                padding: 36px 24px;
                border-radius: 20px;
            }

            .icon {
                font-size: 52px;
            }

            .title {
                font-size: 22px;
            }

            .text {
                font-size: 14px;
            }

            .btn {
                padding: 10px 24px;
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .logo {
                font-size: 28px;
            }

            .card {
                padding: 28px 18px;
            }

            .icon {
                font-size: 44px;
            }

            .title {
                font-size: 20px;
            }

            .text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Логотип -->
        <div class="logo">smc<span>Night</span></div>
        <div class="tagline">интернет-канал</div>

        <!-- Карточка с сообщением -->
        <div class="card">
            <span class="icon">🛠️</span>
            <h1 class="title">Сайт временно не работает</h1>
            <p class="text">
                Мы работаем над улучшением сайта. Скоро здесь появится
                <strong>новый сайт</strong> с обновлённым дизайном и новыми возможностями.
            </p>
            <div class="divider"></div>
            <p class="text" style="font-size: 15px;">
                Спасибо за терпение! 🎬
            </p>
            <button class="btn" onclick="location.reload()">🔄 Проверить снова</button>
            <p class="footer-text">
                © 2025–2026 <strong>smcNight</strong> — интернет-канал
            </p>
        </div>

    </div>

</body>
</html>
